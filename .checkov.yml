# -----------------------------------------------------------------------------
# Checkov Configuration
#
# Security scanner for Terraform configurations.
# Skips are minimal and documented with justification.
# -----------------------------------------------------------------------------

framework:
  - terraform

# Directories to scan
directory:
  - modules/
  - environments/

# Skip .terraform provider cache
skip-path:
  - .terraform
  - "*/.terraform"

# Minimal, justified check suppressions
skip-check:
  # CKV_AWS_18: S3 access logging — log-archive bucket is the log destination itself.
  # Logging a log bucket to itself creates recursion. A separate access-log bucket
  # is a future enhancement.
  - CKV_AWS_18

  # CKV_AWS_144: S3 cross-region replication — not implemented in v1.
  # Single-region design is documented. Cross-region DR is future scope.
  - CKV_AWS_144

  # CKV_AWS_145: S3 KMS encryption — module supports both AES256 and KMS.
  # Default AES256 is valid and documented. KMS is caller's choice.
  - CKV_AWS_145

  # CKV2_AWS_62: S3 event notifications — not required for audit log bucket
  # in v1. Future: SNS notifications for log delivery.
  - CKV2_AWS_62

  # CKV2_AWS_61: S3 lifecycle — lifecycle IS configured but Checkov may not
  # detect dynamic blocks correctly.
  - CKV2_AWS_61

  # CKV_AWS_21: S3 versioning — versioning IS enabled. Checkov may not detect
  # via separate resource blocks (non-inline).
  - CKV_AWS_21
